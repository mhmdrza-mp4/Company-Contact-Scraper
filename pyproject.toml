[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "company-contact-scraper"
version = "1.0.0"
description = "Extract company contact information (emails, phones) from a list of websites."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "mhmdrza-mp4"},
]
dependencies = [
    "requests~=2.31.0",
    "beautifulsoup4~=4.12.0",
    "pandas~=2.2.0",
    "openpyxl~=3.1.0",
    "tqdm~=4.66.0",
]

[project.optional-dependencies]
streamlit = ["streamlit~=1.37.0"]
dev = [
    "pytest~=8.3.0",
    "streamlit~=1.37.0",
]

[project.scripts]
company-scraper = "company_scraper.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
